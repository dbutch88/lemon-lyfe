<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7d538"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8D%8B%3C/text%3E%3C/svg%3E"><style>[hidden]{display:none!important}body{margin:0}</style></head><body><script>window.LL_FIREBASE={"apiKey": "AIzaSyCyjmT1vqkd5EIzEaMg9nGGhkQfFgoqtlQ", "authDomain": "lemon-lyfe.firebaseapp.com", "projectId": "lemon-lyfe", "storageBucket": "lemon-lyfe.firebasestorage.app", "messagingSenderId": "222128215268", "appId": "1:222128215268:web:7c50707bf24628bfc8c8f1"};</script><script>/* Lemon Lyfe standalone backend: game codes + Firebase (Firestore, anonymous sign-in).
   Exposes the same small storage API the game used inside Claude:
   db.doc(path) -> {get,set,update(deep merge),delete,onSnapshot,acquire}
   db.collection(path) -> {where(f,'==',v)...get(), onSnapshot}
   Everything for one game lives under games/<CODE>/... ; each doc stores its JSON in field "j"
   (Firestore can't hold nested arrays, which the game state uses).
   ?mock=1 swaps Firebase for a localStorage backend, for testing on one machine. */
window.LL=(()=>{
  const FB='https://www.gstatic.com/firebasejs/13.1.0/';
  const qs=new URLSearchParams(location.search),MOCK=qs.has('mock');
  const ALPH='ABCDEFGHJKMNPQRSTUVWXYZ23456789',clean=s=>(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);
  let code=clean(qs.get('g')),raw=null,uid=null;
  const LAST='ll-last-game';
  const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
  const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
  const isObj=o=>o&&typeof o==='object'&&!Array.isArray(o);
  function merge(a,b){const r=isObj(a)?{...a}:{};for(const k of Object.keys(b)){r[k]=isObj(b[k])&&isObj(r[k])?merge(r[k],b[k]):clone(b[k])}return r}

  /* ---------- raw backends: path is relative to the game ---------- */
  async function firebaseRaw(){
    const cfg=window.LL_FIREBASE;if(!cfg)throw new Error('Firebase is not set up yet');
    const [A,Au,F]=await Promise.all([import(FB+'firebase-app.js'),import(FB+'firebase-auth.js'),import(FB+'firebase-firestore.js')]);
    const app=A.initializeApp(cfg),auth=Au.getAuth(app);
    if(!auth.currentUser)await Au.signInAnonymously(auth);
    uid=auth.currentUser.uid;
    const fs=F.getFirestore(app);
    const ref=p=>F.doc(fs,'games',code,...p.split('/')),col=p=>F.collection(fs,'games',code,...p.split('/'));
    const val=s=>s.exists()?JSON.parse(s.data().j):null,wrap=o=>({j:JSON.stringify(o),t:Date.now()});
    return{
      get:async p=>val(await F.getDoc(ref(p))),
      set:(p,o)=>F.setDoc(ref(p),wrap(o)),
      del:p=>F.deleteDoc(ref(p)),
      listen:(p,cb,err)=>F.onSnapshot(ref(p),s=>cb(val(s)),err),
      list:async p=>(await F.getDocs(col(p))).docs.map(d=>({id:d.id,obj:JSON.parse(d.data().j)})),
      listenCol:(p,cb,err)=>F.onSnapshot(col(p),q=>cb(q.docs.map(d=>({id:d.id,obj:JSON.parse(d.data().j)}))),err),
      txn:(p,fn)=>F.runTransaction(fs,async t=>{const s=await t.get(ref(p));const r=fn(val(s));if(r.write!==undefined)t.set(ref(p),wrap(r.write));return r.ret})};
  }
  function mockRaw(){
    let id=store.get('llmock-uid');if(!id||qs.has('fresh')){id='m'+Math.random().toString(36).slice(2,9);if(!qs.has('fresh'))store.set('llmock-uid',id)}
    uid=qs.get('as')||id;
    const K=p=>'llmock:'+code+':'+p,subs=[];
    const read=p=>{const v=store.get(K(p));return v?JSON.parse(v):null};
    const keysUnder=p=>{const pre=K(p)+'/',r=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith(pre)&&!k.slice(pre.length).includes('/'))r.push(k)}return r};
    const listOf=p=>keysUnder(p).map(k=>({id:k.slice(K(p).length+1),obj:JSON.parse(localStorage.getItem(k))}));
    const fire=()=>subs.forEach(s=>s());
    addEventListener('storage',e=>{if(e.key&&e.key.startsWith('llmock:'))fire()});
    const later=f=>setTimeout(f,0);
    return{
      get:async p=>read(p),
      set:async(p,o)=>{store.set(K(p),JSON.stringify(o));later(fire)},
      del:async p=>{try{localStorage.removeItem(K(p))}catch(e){}later(fire)},
      listen:(p,cb)=>{let last;const f=()=>{const v=store.get(K(p));if(v!==last){last=v;cb(v?JSON.parse(v):null)}};subs.push(f);later(()=>{last=undefined;f()});return()=>{}},
      list:async p=>listOf(p),
      listenCol:(p,cb)=>{let last;const f=()=>{const l=listOf(p),s=JSON.stringify(l);if(s!==last){last=s;cb(l)}};subs.push(f);later(f);return()=>{}},
      txn:async(p,fn)=>{const r=fn(read(p));if(r.write!==undefined){store.set(K(p),JSON.stringify(r.write));later(fire)}return r.ret}};
  }

  /* ---------- the API the game expects ---------- */
  function makeDb(R){
    const snap=o=>({exists:o!=null,data:()=>clone(o)==null?undefined:clone(o)});
    const docs=l=>({docs:l.map(x=>({id:x.id,data:()=>clone(x.obj)}))});
    return{
      doc:p=>({
        get:async()=>snap(await R.get(p)),
        set:o=>R.set(p,clone(o)),
        update:o=>R.txn(p,cur=>({write:merge(cur||{},o)})),
        delete:()=>R.del(p),
        onSnapshot:(cb,err)=>R.listen(p,o=>cb(snap(o)),err),
        acquire:async({holder,ttlMs})=>({acquired:await R.txn(p,cur=>{const now=Date.now();if(cur&&cur.exp>now&&cur.holder!==holder)return{ret:false};return{write:{holder,exp:now+(ttlMs||20000)},ret:true}})})}),
      collection:p=>{const q=f=>({where:(k,op,v)=>q([...f,[k,v]]),
        get:async()=>docs((await R.list(p)).filter(x=>f.every(([k,v])=>x.obj&&x.obj[k]===v))),
        onSnapshot:(cb,err)=>R.listenCol(p,l=>cb(docs(l)),err)});return q([])}};
  }

  /* ---------- landing: start or join a game ---------- */
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const newCode=()=>Array.from({length:5},()=>ALPH[Math.floor(Math.random()*ALPH.length)]).join('');
  const linkFor=c=>location.origin+location.pathname+'?g='+c+(MOCK?'&mock=1':'');
  function go(c){code=c;store.set(LAST,c);const u=new URL(location.href);u.searchParams.set('g',c);history.replaceState(null,'',u)}
  function landing(){
    return new Promise(resolve=>{
      const app=document.getElementById('app'),last=clean(store.get(LAST));
      const draw=(msg='')=>{app.innerHTML=`<div class="panel llland">
        <h2>Lemon Lyfe</h2><p class="muted">Kid crews, lemonade stands and turf wars. Start a game and send your friends the link, or join theirs.</p>
        ${last?`<div class="row"><button class="btn primary" data-ll="cont">Continue game ${esc(last)}</button></div>`:''}
        <div class="row"><button class="btn ${last?'':'primary'}" data-ll="new">Start a new game</button></div>
        <div class="field"><label for="ll-code">Join with a game code</label><div class="row" style="flex-wrap:nowrap"><input id="ll-code" class="llcode" maxlength="8" autocomplete="off" autocapitalize="characters" placeholder="ABCDE"><button class="btn" data-ll="join">Join</button></div></div>
        ${msg?`<p class="llmsg" role="status">${esc(msg)}</p>`:''}</div>`};
      draw();
      const onClick=async e=>{const b=e.target.closest('[data-ll]');if(!b||!app.contains(b))return;const a=b.dataset.ll;
        if(a==='new'){app.removeEventListener('click',onClick);go(newCode());resolve()}
        else if(a==='cont'){app.removeEventListener('click',onClick);go(last);resolve()}
        else if(a==='join'){const c=clean(document.getElementById('ll-code').value);if(c.length<4)return draw('Type the code your friend sent you.');
          code=c;const R=raw;let ok=false;try{ok=!!(await R.get('game/state'))}catch(x){}
          if(!ok){code='';return draw(`No game found with the code ${c}. Check it and try again.`)}
          app.removeEventListener('click',onClick);go(c);resolve()}};
      app.addEventListener('click',onClick);
      app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ll-code'){const b=app.querySelector('[data-ll="join"]');if(b)b.click()}});
    });
  }

  /* ---------- invite box shown in the lobby ---------- */
  let copied=0;
  document.addEventListener('click',async e=>{const b=e.target.closest('[data-ll="share"],[data-ll="switch"]');if(!b)return;
    if(b.dataset.ll==='switch'){location.href=location.pathname+(MOCK?'?mock=1':'');return}
    const url=linkFor(code),text=`Join my Lemon Lyfe game! Code ${code}`;
    if(navigator.share){try{await navigator.share({title:'Lemon Lyfe',text,url});return}catch(x){if(x&&x.name==='AbortError')return}}
    try{await navigator.clipboard.writeText(url);copied=Date.now();b.textContent='Link copied!';setTimeout(()=>{b.textContent='Invite friends'},2200)}
    catch(x){prompt('Copy this link and send it to your friends:',url)}});
  const inviteHTML=()=>code?`<div class="panel llinvite"><div><span class="small muted">Game code</span><div class="llbig">${esc(code)}</div></div><div class="llbtns"><button class="btn primary" data-ll="share">Invite friends</button><button class="linkbtn small" data-ll="switch">Switch game</button></div></div>`:'';

  const css=document.createElement('style');
  css.textContent=`.llinvite{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .llbig{font-family:var(--mono,monospace);font-size:26px;font-weight:600;letter-spacing:.12em}
  .llbtns{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  .llland h2{font-family:var(--display,inherit);font-size:30px;margin:4px 0 6px}
  .llland .row .btn{flex:1}
  .llcode{flex:1;min-width:0;font:inherit;font-family:var(--mono,monospace);font-size:20px;letter-spacing:.12em;text-transform:uppercase;padding:10px 12px;border:2px solid var(--line,#ccc);border-radius:12px;background:var(--surface,#fff);color:var(--ink,#111)}
  .llmsg{color:var(--bad,#c2372f);font-weight:700;margin:10px 0 0}`;
  document.head.appendChild(css);

  async function connect(){
    raw=MOCK?mockRaw():await firebaseRaw();
    if(!code)await landing();else store.set(LAST,code);
    return{db:makeDb(raw),uid};
  }
  function fail(e){const app=document.getElementById('app'),c=String(e&&(e.code||e.message)||'');
    const msg=/network|offline|unavailable/i.test(c)?'Check your internet connection and reload the page.'
      :/admin-restricted|operation-not-allowed/i.test(c)?'Guest sign-in is switched off in Firebase (Authentication → Sign-in method → Anonymous).'
      :/permission/i.test(c)?'The database rules are blocking the game. Check the Firestore rules were published.'
      :/not set up/i.test(c)?'This copy of the game is not connected to a database yet.':'Something went wrong. Reload the page to try again.';
    if(app)app.innerHTML=`<div class="panel"><h2>Can't reach the game</h2><p class="muted">${esc(msg)}</p><p class="small muted">${esc(c)}</p></div>`}
  return{connect,fail,inviteHTML,code:()=>code};
})();
</script><title>Lemon Lyfe</title>

  --display:'Bungee', 'Arial Black', Impact, sans-serif;

let rMode='quick';
const QUICK=['Run the block','Your turn, step by step','Making money','Fighting','Sending a crew'];
function deckCards(){const all=ruleCards();return rMode==='quick'?QUICK.map(t=>all.find(c=>c.t===t)).filter(Boolean):all}
const TOPIC_GROUPS=[['Basics',['Run the block','The board','Your turn, step by step','Making money','The shop','Recruits']],['Fighting',['Fighting','Sending a crew','Brawls','Bonuses','Moving']],['Twists',['Market days','Dirty tricks','Alliances','Bank of Mom & Dad']],['Setup & players',['Games and campaigns','The crew bosses','Leaving & surrender']]];
function rulesIndex(){const all=ruleCards();
  return `<div class="panel rindex"><span class="eyebrow">How to play</span><h2>All the rules</h2><p class="small muted">New here? <button class="linkbtn" data-act="rulesmode" data-m="quick">Take the 1-minute quick start</button></p>
    ${TOPIC_GROUPS.map(([g,ts])=>`<div class="rgroup"><b>${g}</b><div class="rtopics">${ts.map(t=>{const i=all.findIndex(c=>c.t===t);return i<0?'':`<button data-act="rtopic" data-i="${i}">${esc(t)}</button>`}).join('')}</div></div>`).join('')}
    <div class="row"><button class="btn primary" data-act="tab" data-tab="board">Back to the board</button></div></div>`}
function rulesView(){if(rMode==='index')return rulesIndex();
  const cards=deckCards(),n=cards.length;rIdx=Math.max(0,Math.min(n-1,rIdx));const c=cards[rIdx],el=Date.now()-rAt,anim=rAt&&el<700,quick=rMode==='quick';
  return `<div class="rdeck"><div class="rcard ${anim?(rDir>0?'in-r':'in-l'):''}" style="--dl:-${anim?el:0}ms" data-rswipe="1">
    <div class="rart">${c.art}</div><div class="rtext"><span class="eyebrow">${quick?'Quick start':'How to play'} · ${rIdx+1} of ${n}<button class="linkbtn rtopicsbtn" data-act="rulesmode" data-m="index">All topics</button></span><h2>${c.t}</h2>${c.b}${quick&&rIdx===n-1?'<button class="small rready" data-act="rulesmode" data-m="index"><span><b>That’s enough to play.</b> Learn alliances, tricks, market days and the bank as you go, or tap here to see <b>all the rules</b>.</span><span class="rready-go" aria-hidden="true">›</span></button>':''}</div></div>
    <div class="rdots ${n>10?'many':''}" role="tablist" aria-label="Rule cards">${cards.map((x,i)=>`<button class="${i===rIdx?'on':''}" data-act="rgo" data-i="${i}" aria-label="${esc(x.t)}" aria-selected="${i===rIdx}"></button>`).join('')}</div>
    <div class="rbtns"><button class="btn" data-act="rstep" data-d="-1" ${rIdx?'':'disabled'}>Back</button>${rIdx<n-1?'<button class="btn primary" data-act="rstep" data-d="1">Next</button>':quick?'<button class="btn primary" data-act="tab" data-tab="board">Start playing</button>':'<button class="btn primary" data-act="rulesmode" data-m="index">All topics</button>'}</div></div>`}

function resetConfirm(){return confirmReset?`<div class="banner">This wipes the board and every crew. <div class="row" style="margin-top:8px"><button class="btn primary" data-act="reset-yes">Yes, wipe it</button><button class="btn" data-act="reset-no">Keep playing</button></div></div>`:''}

function cornerOptions(list,selected,withOwner){return list.map(i=>{const co=st.corners[i];const o=co.o?st.players[co.o]?.name:'empty';
  return `<option value="${i}" ${+selected===i?'selected':''}>${esc(label(st,i))} · ${withOwner?esc(o)+' · ':''}${co.s}</option>`}).join('')}
function ordersView(){
  const p=myP();
  if(st.status==='over')return `<div class="panel"><h2>The campaign is over</h2><p class="muted">Check the board for the final standings.</p></div>`;
  if(!p)return `<div class="panel"><h2>You're watching</h2><p class="muted">This campaign started without you. You can follow the board and the log.</p></div>`;
  if(p.alive===false)return `<div class="panel"><h2>Your crew is out</h2><p class="muted">You lost your last corner. You can still follow the board and the log.</p></div>`;
  if(morningPending())return `<div class="panel"><h2>Start your day first</h2><p class="muted">Watch what happened last night and roll for sales on the Board tab. Then your orders for ${DW()} ${st.day} unlock.</p><div class="row"><button class="btn primary" data-act="tab" data-tab="board">Start my day</button></div></div>`;
  ensureDraft();
  const sent=hasOrder(me);
  let h=`<div class="panel"><span class="eyebrow">${st.status==='setup'?'Setup day':DW()+' '+st.day} orders</span><p>${sent?(dirty?'<span class="bad">You have unsent changes.</span>':'<span class="ok">Orders in.</span> You can change them until the day resolves.'):'No orders sent yet.'} <span class="muted">Deadline ${esc(fmtTime(st.nextResolveAt))}.</span></p></div>`;
  return h+(st.status==='setup'?setupOrders():dayOrders());
}
function placePanel(){
  ensureDraft();const left=START_SOLDIERS-placedCount(),sent=hasOrder(me);
  return `<div class="panel"><div class="row" style="justify-content:space-between;align-items:center;flex-wrap:nowrap"><div><span class="bigcount ${left?'':'ok'}">${left}</span> <span class="muted small">of ${START_SOLDIERS} to place</span></div>
    <div class="seg" role="group" aria-label="What a tap does" style="min-width:170px"><button data-act="pmode" data-m="add" aria-pressed="${placeMode==='add'}">+ Add</button><button data-act="pmode" data-m="remove" aria-pressed="${placeMode==='remove'}">− Remove</button></div></div>
  <div class="youare" style="--crew:${esc(crewColor(me))}">${avatar(charOf(me),crewColor(me),32)}<span><b>You're ${esc(myP().name)}</b> · ${placeMode==='add'?`tap your <i class="sw"></i><b class="cn">${COLOR_NAME[crewColor(me)]||'glowing'}</b> corners`:'tap a ringed corner to take one back'}</span></div>
  <div class="row phase-nav"><button class="btn" data-act="pl-clear" ${placedCount()?'':'disabled'}>Clear</button><button class="btn primary" data-act="submit" ${canWrite&&(dirty||!sent)?'':'disabled'}>${sent&&!dirty?'Placement sent ✓':sent?'Update placement':'Send placement'}</button></div></div>`}
function setupOrders(){
  const left=START_SOLDIERS-placedCount();
  return `<div class="panel"><h2>Place your crew on the board</h2><p class="muted">Tap your corners on the map to add recruits. You have ${left} of ${START_SOLDIERS} left to place.</p>
  <div class="row"><button class="btn primary" data-act="tab" data-tab="board">Go to the board</button></div></div>`}
function shopRow(cat,name){const p=myP(),k=draft.buy[cat],cur=TIERS[cat][p[cat]+k],next=TIERS[cat][p[cat]+k+1],left=cashLeft();
  const f=t=>cat==='whip'?`${t.cap} seats`:cat==='rep'?repStr(t.b):`d${t.d}`;
  return `<div class="tile ${k?'bought':''}"><span class="tile-l">${name}</span><span class="tile-v">${f(cur)}</span><span class="tile-n" title="${esc(cur.n)}">${esc(cur.n)}</span>
    ${next?`<button class="tile-b" data-act="buy" data-cat="${cat}" data-d="1" ${upCost(st,next)<=left?'':'disabled'} aria-label="Upgrade ${name} to ${esc(next.n)} for $${upCost(st,next)}">${f(next)} · $${upCost(st,next)}${upCost(st,next)<next.c?' 🏷':''}</button>`:'<span class="tile-max">Maxed</span>'}
    ${k?`<button class="tile-u" data-act="buy" data-cat="${cat}" data-d="-1" aria-label="Undo ${name} upgrade">Undo</button>`:''}</div>`}
function dayOrders(){
  const p=myP(),mine=cornersOf(st,me),others=st.corners.map((c,i)=>i).filter(i=>st.corners[i].o!==me),left=cashLeft(),cap=capToday(),b=draft.buy;
  let h=`<div class="panel"><h2>Shop</h2><div class="shop">${shopRow('weapon','Weapons')}${shopRow('sugar','Sugar')}${shopRow('whip','Whip')}${shopRow('rep','Rep')}
    <div class="shop-row"><div class="shop-name"><span class="eyebrow">Recruits</span><strong>Recruits</strong> <span class="mono small">$${SOLDIER_COST} each</span></div><div class="shop-next">Arrive before any fighting</div>
    <div class="stepper"><button data-act="sold" data-d="-1" ${b.soldiers?'':'disabled'} aria-label="One fewer">−</button><span class="n">${b.soldiers}</span><button data-act="sold" data-d="1" ${left>=10?'':'disabled'} aria-label="One more">+</button><button data-act="sold" data-d="5" ${left>=50?'':'disabled'}>+5</button></div></div></div>`;
  if(b.soldiers)h+=`<div class="field"><label for="recruitsTo">Send recruits to</label><select id="recruitsTo" data-f="recruitsTo">${cornerOptions(mine,draft.recruitsTo??mine.slice().sort((x,y)=>st.corners[y].s-st.corners[x].s)[0])}</select></div>`;
  h+=`<div class="totals"><span>Cash $${p.cash} − spend $${spend()}</span><span class="${left<0?'bad':'ok'}">$${left} left</span></div></div>`;
  h+=`<div class="panel"><h2>Attacks</h2><p class="small muted">Your whip fits ${cap} per attack. One recruit always stays behind. Attacks run in turns with the other crews, so a corner can change hands before your attack lands.</p>`;
  draft.attacks.forEach((a,k)=>{const fs=st.corners[a.from]?.s||0,extra=(b.soldiers&&+draft.recruitsTo===+a.from)?b.soldiers:0,max=Math.max(1,Math.min(cap,fs+extra-1));
    h+=`<div class="attack"><div class="head"><strong>Attack ${k+1}</strong><button class="linkbtn" data-act="atk-del" data-k="${k}">Remove</button></div>
    <div class="row"><div class="field"><label for="atk-${k}-from">From</label><select id="atk-${k}-from" data-f="atk-from" data-k="${k}">${cornerOptions(mine,a.from)}</select></div>
    <div class="field"><label for="atk-${k}-to">Target</label><select id="atk-${k}-to" data-f="atk-to" data-k="${k}">${cornerOptions(others,a.to,true)}</select></div></div>
    <div class="row"><div class="field"><label for="atk-${k}-n">Send (max ${max})</label><input id="atk-${k}-n" type="number" min="1" max="${max}" value="${a.n}" data-f="atk-n" data-k="${k}"></div>
    <div class="field"><label for="atk-${k}-r">Retreat when down to</label><input id="atk-${k}-r" type="number" min="0" value="${a.retreatAt||0}" data-f="atk-r" data-k="${k}"></div></div></div>`});

    return save(()=>stateRef.update({players:{[me]:{ally:u,allyFrom:d+1,allyUntil:d+ALLY_TURNS,allyCount:(P.allyCount|0)+1,allyNote:true,offers:{[u]:0}},[u]:{ally:me,allyFrom:d+1,allyUntil:d+ALLY_TURNS,allyCount:(Q.allyCount|0)+1,offers:{[me]:0}}}}))}

/* ---------- day resolution ---------- */
async function doResolve(force){
  const lock=db.doc('game/lock'),r=await lock.acquire({holder:me||tabId,ttlMs:20000});if(!r.acquired)return;
  const snap=await stateRef.get();if(!snap.exists)return;const cur=normalizeNames(JSON.parse(JSON.stringify(snap.data())));
  if(cur.status!=='setup'&&cur.status!=='active')return;
  const q=await db.collection('orders').where('gameId','==',cur.gameId).where('day','==',cur.day).get();
  const om={};q.docs.forEach(d=>{const x=d.data();if(x&&x.uid===d.id)om[d.id]=x});
  const humans=humansAlive(cur),all=humans.length>0&&humans.every(u=>om[u]);
  aliveUids(cur).filter(u=>isCpu(cur.players[u])).forEach(u=>{const o=botOrders(cur,u);if(o)om[u]=o});
  if(!force&&!(Date.now()>=cur.nextResolveAt||all))return;
  const ns=resolveDay(cur,om);await db.doc('game/prev').set({state:cur});await stateRef.set(ns);
}
async function maybeResolve(){
  if(!st||!db||resolving||!canWrite||!me)return;if(st.status!=='setup'&&st.status!=='active')return;
  const humans=humansAlive(st),all=humans.length>0&&humans.every(hasOrder);
  if(!(Date.now()>=st.nextResolveAt||all))return;
  if(Date.now()-lastAttempt<5000)return;lastAttempt=Date.now();
  resolving=true;try{await doResolve(false)}catch(e){console.warn('resolve',e)}finally{resolving=false}
}

window.addEventListener('resize',()=>{lastAsp=null;render()});
/* ---------- boot ---------- */
(async function boot(){
  try{const be=await LL.connect();db=be.db;me=realMe=be.uid}catch(e){console.warn(e);LL.fail(e);return}
  if(!db){loaded=true;render();return}
  stateRef=db.doc('game/state');
  stateRef.onSnapshot(s=>{st=s.exists?normalizeNames(JSON.parse(JSON.stringify(s.data()))):null;loaded=true;if(st&&sel!=null&&(!st.corners||sel>=st.corners.length))sel=null;if(!st||!st.players||!st.players[me]||(me!==realMe&&st.players[me].ctrl!==realMe))me=realMe;render();maybeResolve()},
    e=>{loaded=true;notice="Lost the connection to the board. Reload the page.";render()});
  db.doc('game/prev').onSnapshot(s=>{hasPrev=!!(s.exists&&s.data().state);render()},e=>{});
  db.collection('orders').onSnapshot(q=>{const o={};q.docs.forEach(d=>o[d.id]=d.data());orders=o;if(!dirty)draftKey='';render();maybeResolve()},e=>console.warn(e));
  setInterval(()=>{renderHeader();maybeResolve()},30000);
  setInterval(()=>{if(!st||st.mode!=='game'||(st.status!=='setup'&&st.status!=='active'))return;const c=document.getElementById('turnclock');if(c){c.textContent='⏱ '+clockText();c.classList.toggle('urgent',st.nextResolveAt-Date.now()<30000)}if(Date.now()>=st.nextResolveAt)maybeResolve()},1000);
})();
